<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士路線地圖地圖預覽</title>
    
    <!-- Leaflet 地圖樣式 (CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f7;
        }

        /* 頂部控制面板 */
        .control-panel {
            background: #ffffff;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        select, input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: #007aff;
        }

        /* 地圖區域 */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* 載入中狀態顯示 */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 頂部選單 -->
    <div class="control-panel">
        <div class="form-group">
            <label for="route-input">1. 選擇或輸入路線</label>
            <input type="text" id="route-input" list="route-list" placeholder="例如: 1A, 290X, 603">
            <datalist id="route-list"></datalist>
        </div>

        <div class="form-group">
            <label for="bound-select">2. 選擇方向</label>
            <select id="bound-select" disabled>
                <option value="outbound">去程</option>
                <option value="inbound">回程</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stop-select">3. 選擇巴士站 (無須重新搜尋路線)</label>
            <select id="stop-select" disabled>
                <option value="">請先選擇路線</option>
            </select>
        </div>
    </div>

    <!-- 地圖呈現區域 -->
    <div style="position: relative; flex: 1;">
        <div id="loading" class="loading-overlay">數據載入中...</div>
        <div id="map"></div>
    </div>

    <!-- Leaflet 地圖 JavaScript 庫 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // API 基礎地址 (data.gov.hk / 九巴 Open API)
        const API_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
        
        let map;
        let stopMarkers = [];
        let polylineLayer = null;
        let routeStopsData = []; // 緩存目前路線的站點資訊

        // 初始化頁面與地圖
        window.onload = function() {
            initMap();
            loadAllRoutes();
            setupEventListeners();
        };

        // 1. 初始化 Leaflet 地圖 (以香港中心點為基礎)
        function initMap() {
            map = L.map('map').setView([22.3193, 114.1694], 12); // 香港中心座標
            
            // 使用 OpenStreetMap 免費地圖圖層
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // 2. 載入全港九巴路線清單
        async function loadAllRoutes() {
            try {
                const res = await fetch(`${API_BASE}/route`);
                const data = await res.json();
                
                const routeList = document.getElementById('route-list');
                const routes = Array.from(new Set(data.data.map(r => r.route))).sort();
                
                routes.forEach(route => {
                    const opt = document.createElement('option');
                    opt.value = route;
                    routeList.appendChild(opt);
                });
            } catch (err) {
                console.error("無法取得路線列表:", err);
            }
        }

        // 3. 事件監聽設定
        function setupEventListeners() {
            const routeInput = document.getElementById('route-input');
            const boundSelect = document.getElementById('bound-select');
            const stopSelect = document.getElementById('stop-select');

            // 路線變更時
            routeInput.addEventListener('change', () => {
                boundSelect.disabled = false;
                loadRouteDetails();
            });

            // 方向變更時
            boundSelect.addEventListener('change', loadRouteDetails);

            // 車站變更時 (點擊下拉選單即時定位地圖)
            stopSelect.addEventListener('change', (e) => {
                const stopId = e.target.value;
                if (!stopId) return;

                const targetStop = routeStopsData.find(s => s.stop === stopId);
                if (targetStop) {
                    // 將地圖移動至選定車站，並放大至 17 級
                    map.flyTo([targetStop.lat, targetStop.long], 17, { duration: 1.2 });
                    
                    // 自動開啟對應站點的彈出氣泡 (Popup)
                    const marker = stopMarkers.find(m => m.stopId === stopId);
                    if (marker) marker.openPopup();
                }
            });
        }

        // 4. 根據路線與方向取得車站數據並繪製地圖
        async function loadRouteDetails() {
            const route = document.getElementById('route-input').value.trim().toUpperCase();
            const bound = document.getElementById('bound-select').value;
            const stopSelect = document.getElementById('stop-select');
            const loading = document.getElementById('loading');

            if (!route) return;

            loading.style.display = 'flex';
            stopSelect.disabled = true;

            try {
                // A. 取得路線的車站順序 (Route-Stop API)
                const rsRes = await fetch(`${API_BASE}/route-stop/${route}/${bound}/1`);
                const rsData = await rsRes.json();
                const stopList = rsData.data;

                if (!stopList || stopList.length === 0) {
                    alert("查無此路線數據，請確定方向或路線編號。");
                    loading.style.display = 'none';
                    return;
                }

                // B. 平行請求 (Promise.all) 取得每個車站的名稱與座標 (Stop API)
                const stopPromises = stopList.map(s => 
                    fetch(`${API_BASE}/stop/${s.stop}`).then(res => res.json())
                );
                const stopResults = await Promise.all(stopPromises);
                
                routeStopsData = stopResults.map(r => r.data);

                // C. 更新車站下拉選單 (使用者可隨時單獨切換)
                stopSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>';
                routeStopsData.forEach((stop, idx) => {
                    const opt = document.createElement('option');
                    opt.value = stop.stop;
                    opt.textContent = `${idx + 1}. ${stop.name_tc}`;
                    stopSelect.appendChild(opt);
                });
                stopSelect.disabled = false;

                // D. 繪製地圖標記與路線
                renderMapElements(routeStopsData);

            } catch (err) {
                console.error("載入路線詳情失敗:", err);
                alert("載入數據時發生錯誤。");
            } finally {
                loading.style.display = 'none';
            }
        }

        // 5. 地圖渲染：標記與路線軌跡
        function renderMapElements(stops) {
            // 清除舊有的標記與畫線
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];
            if (polylineLayer) map.removeLayer(polylineLayer);

            const latLngs = [];

            stops.forEach((stop, idx) => {
                const lat = parseFloat(stop.lat);
                const lng = parseFloat(stop.long);
                const pos = [lat, lng];
                latLngs.push(pos);

                // 建立車站標記 (Marker)
                const marker = L.marker(pos)
                    .addTo(map)
                    .bindPopup(`<b>${idx + 1}. ${stop.name_tc}</b><br>${stop.name_en}`);

                // 車站 Marker 的獨立標識
                marker.stopId = stop.stop;

                // 點擊地圖上的 Marker 時同步更新下拉選單
                marker.on('click', () => {
                    document.getElementById('stop-select').value = stop.stop;
                });

                stopMarkers.push(marker);
            });

            // 連結各車站連成路線 (Polyline)
            polylineLayer = L.polyline(latLngs, { color: '#007aff', weight: 4, opacity: 0.8 }).addTo(map);

            // 自動調整地圖視野以包含整條路線
            map.fitBounds(polylineLayer.getBounds(), { padding: [30, 30] });
        }
    </script>
</body>
</html>
