<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士路線地圖與實時預報預覽</title>
    
    <!-- Leaflet 地圖樣式 (CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f7;
        }

        /* 頂部控制面板 */
        .control-panel {
            background: #ffffff;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        select, input {
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        select:focus, input:focus {
            border-color: #007aff;
        }

        /* ETA 顯示框樣式 */
        .eta-box {
            background: #f0f4f8;
            border: 1px solid #d0dbe5;
            border-radius: 6px;
            padding: 6px 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
        }

        .eta-badge {
            background: #007aff;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eta-badge .eta-rmk {
            font-size: 9px;
            opacity: 0.85;
            font-weight: normal;
        }

        .eta-placeholder {
            font-size: 12px;
            color: #888;
        }

        /* 地圖區域 */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* 載入中狀態顯示 */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 頂部選單面板 -->
    <div class="control-panel">
        <div class="form-group">
            <label for="route-input">1. 選擇或輸入路線</label>
            <input type="text" id="route-input" list="route-list" placeholder="例如: 1A, 290X, 603">
            <datalist id="route-list"></datalist>
        </div>

        <div class="form-group">
            <label for="bound-select">2. 選擇方向</label>
            <select id="bound-select" disabled>
                <option value="">請先選擇路線</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stop-select">3. 選擇巴士站</label>
            <select id="stop-select" disabled>
                <option value="">請先選擇路線與方向</option>
            </select>
        </div>

        <!-- 4. 新增：實時到站預報 -->
        <div class="form-group">
            <label>4. 下3班車預計到站時間 (ETA)</label>
            <div id="eta-display" class="eta-box">
                <span class="eta-placeholder">請先選擇車站</span>
            </div>
        </div>
    </div>

    <!-- 地圖呈現區域 -->
    <div style="position: relative; flex: 1;">
        <div id="loading" class="loading-overlay">高精度數據與路線繪製中...</div>
        <div id="map"></div>
    </div>

    <!-- Leaflet 地圖 JavaScript 庫與箭咀外掛 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>

    <script>
        const API_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
        
        let map;
        let stopMarkers = [];
        let polylineLayer = null;
        let decoratorLayer = null;
        let routeStopsData = []; 
        let sortedRouteNames = [];
        let allRoutesMap = {}; 

        window.onload = function() {
            initMap();
            loadAllRoutes();
            setupEventListeners();
        };

        // 1. 初始化 Leaflet 地圖
        function initMap() {
            map = L.map('map').setView([22.3193, 114.1694], 12);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // 2. 載入全港九巴路線清單
        async function loadAllRoutes() {
            try {
                const res = await fetch(`${API_BASE}/route`);
                const data = await res.json();
                
                data.data.forEach(item => {
                    const rName = item.route;
                    if (!allRoutesMap[rName]) {
                        allRoutesMap[rName] = [];
                    }
                    if (item.service_type === "1") {
                        allRoutesMap[rName].push({
                            bound: item.bound === 'O' ? 'outbound' : 'inbound',
                            dest: item.dest_tc,
                            orig: item.orig_tc
                        });
                    }
                });

                sortedRouteNames = Object.keys(allRoutesMap).sort();
                updateRouteDatalist(''); // 預設載入全清單
            } catch (err) {
                console.error("無法取得路線列表:", err);
            }
        }

        // 前綴篩選 Datalist 更新函數
        function updateRouteDatalist(prefix) {
            const routeList = document.getElementById('route-list');
            routeList.innerHTML = '';
            
            const query = prefix.trim().toUpperCase();
            // 嚴格前綴比對
            const filtered = query 
                ? sortedRouteNames.filter(r => r.startsWith(query)) 
                : sortedRouteNames;

            // 限制最多填入 80 項，保障前端 DOM 效能
            filtered.slice(0, 80).forEach(route => {
                const opt = document.createElement('option');
                opt.value = route;
                routeList.appendChild(opt);
            });
        }

        // 3. 設定事件監聽
        function setupEventListeners() {
            const routeInput = document.getElementById('route-input');
            const boundSelect = document.getElementById('bound-select');
            const stopSelect = document.getElementById('stop-select');

            // 輸入文字時，即時觸發「前綴篩選」
            routeInput.addEventListener('input', (e) => {
                updateRouteDatalist(e.target.value);
            });

            // 路線確認變更時
            routeInput.addEventListener('change', () => {
                const route = routeInput.value.trim().toUpperCase();
                if (!route || !allRoutesMap[route]) return;

                boundSelect.innerHTML = '';
                const bounds = allRoutesMap[route];
                
                bounds.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.bound;
                    opt.textContent = `往 ${b.dest}`;
                    boundSelect.appendChild(opt);
                });

                boundSelect.disabled = false;
                loadRouteDetails();
            });

            // 方向變更時
            boundSelect.addEventListener('change', loadRouteDetails);

            // 車站變更時：移動地圖 + 讀取到站預報 (ETA)
            stopSelect.addEventListener('change', (e) => {
                const stopId = e.target.value;
                if (!stopId) return;

                onStopSelected(stopId);
            });
        }

        // 車站選取觸發事件
        function onStopSelected(stopId) {
            const targetStop = routeStopsData.find(s => s.stop === stopId);
            if (targetStop) {
                map.flyTo([targetStop.lat, targetStop.long], 17, { duration: 1.2 });
                const marker = stopMarkers.find(m => m.stopId === stopId);
                if (marker) marker.openPopup();

                // 查詢實時到站預報
                const route = document.getElementById('route-input').value.trim().toUpperCase();
                const bound = document.getElementById('bound-select').value;
                fetchETA(stopId, route, bound);
            }
        }

        // 4. 取得車站數據並發起高精準繪製
        async function loadRouteDetails() {
            const route = document.getElementById('route-input').value.trim().toUpperCase();
            const bound = document.getElementById('bound-select').value;
            const stopSelect = document.getElementById('stop-select');
            const etaDisplay = document.getElementById('eta-display');
            const loading = document.getElementById('loading');

            if (!route || !bound) return;

            loading.style.display = 'flex';
            stopSelect.disabled = true;
            etaDisplay.innerHTML = '<span class="eta-placeholder">請先選擇車站</span>';

            try {
                const rsRes = await fetch(`${API_BASE}/route-stop/${route}/${bound}/1`);
                const rsData = await rsRes.json();
                const stopList = rsData.data;

                if (!stopList || stopList.length === 0) {
                    alert("查無此路線數據。");
                    loading.style.display = 'none';
                    return;
                }

                // 並行抓取各站數據
                const stopPromises = stopList.map(s => 
                    fetch(`${API_BASE}/stop/${s.stop}`).then(res => res.json())
                );
                const stopResults = await Promise.all(stopPromises);
                routeStopsData = stopResults.map(r => r.data);

                // 更新車站選單
                stopSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>';
                routeStopsData.forEach((stop, idx) => {
                    const opt = document.createElement('option');
                    opt.value = stop.stop;
                    opt.textContent = `${idx + 1}. ${stop.name_tc}`;
                    stopSelect.appendChild(opt);
                });
                stopSelect.disabled = false;

                // 繪製標記與高精準行車軌跡
                await renderMapElements(routeStopsData);

                // 預設自動選擇第 1 站並載入 ETA
                if (routeStopsData.length > 0) {
                    stopSelect.value = routeStopsData[0].stop;
                    onStopSelected(routeStopsData[0].stop);
                }

            } catch (err) {
                console.error("載入路線詳情失敗:", err);
                alert("載入數據時發生錯誤。");
            } finally {
                loading.style.display = 'none';
            }
        }

        // 5. 分組路網擬合算法：解決大量點位導致 OSRM 失敗問題
        async function fetchAccuratePath(stops) {
            const chunkSize = 8; // 每組 8 個站點分段請求，確保 100% 成功擬合道路
            let fullPath = [];

            for (let i = 0; i < stops.length - 1; i += chunkSize - 1) {
                const chunkStops = stops.slice(i, i + chunkSize);
                const coordsStr = chunkStops.map(s => `${s.long},${s.lat}`).join(';');
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&continue_straight=true`;

                try {
                    const res = await fetch(osrmUrl);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.routes && data.routes[0]) {
                            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                            if (fullPath.length > 0 && coords.length > 0) {
                                fullPath.push(...coords.slice(1)); // 去除重疊起點
                            } else {
                                fullPath.push(...coords);
                            }
                            continue;
                        }
                    }
                } catch (e) {
                    console.warn("分組 OSRM 請求失敗，該段備用直線擬合:", e);
                }

                // 降級備用方案：若單段 API 異常，該區間以直線平滑連接
                const fallbackLine = chunkStops.map(s => [parseFloat(s.lat), parseFloat(s.long)]);
                if (fullPath.length > 0) {
                    fullPath.push(...fallbackLine.slice(1));
                } else {
                    fullPath.push(...fallbackLine);
                }
            }
            return fullPath;
        }

        // 6. 地圖渲染與標記
        async function renderMapElements(stops) {
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];
            if (polylineLayer) map.removeLayer(polylineLayer);
            if (decoratorLayer) map.removeLayer(decoratorLayer);

            // 建立車站標記 (Marker)
            stops.forEach((stop, idx) => {
                const pos = [parseFloat(stop.lat), parseFloat(stop.long)];
                const marker = L.marker(pos)
                    .addTo(map)
                    .bindPopup(`<b>${idx + 1}. ${stop.name_tc}</b><br>${stop.name_en}`);

                marker.stopId = stop.stop;
                marker.on('click', () => {
                    document.getElementById('stop-select').value = stop.stop;
                    onStopSelected(stop.stop);
                });
                stopMarkers.push(marker);
            });

            // 計算精準道路軌跡
            const accuratePath = await fetchAccuratePath(stops);

            // 繪製藍色擬合軌跡線
            polylineLayer = L.polyline(accuratePath, { 
                color: '#007aff', 
                weight: 5, 
                opacity: 0.85 
            }).addTo(map);

            // 疊加行車箭咀
            decoratorLayer = L.polylineDecorator(polylineLayer, {
                patterns: [
                    {
                        offset: 35,
                        repeat: 90,
                        symbol: L.Symbol.arrowHead({
                            pixelSize: 8,
                            polygon: false,
                            pathOptions: { stroke: true, color: '#003e80', weight: 2 }
                        })
                    }
                ]
            }).addTo(map);

            map.fitBounds(polylineLayer.getBounds(), { padding: [30, 30] });
        }

        // 7. 抓取九巴 API 實時到站預報 (ETA)
        async function fetchETA(stopId, route, boundStr) {
            const etaDisplay = document.getElementById('eta-display');
            etaDisplay.innerHTML = '<span class="eta-placeholder">載入到站時間...</span>';

            const dirCode = (boundStr === 'outbound') ? 'O' : 'I';

            try {
                const res = await fetch(`${API_BASE}/eta/${stopId}/${route}/1`);
                const json = await res.json();

                if (!json.data || json.data.length === 0) {
                    etaDisplay.innerHTML = '<span class="eta-placeholder">暫無到站資料</span>';
                    return;
                }

                // 過濾方向與有效 ETA
                const filtered = json.data
                    .filter(item => item.dir === dirCode && item.eta)
                    .sort((a, b) => new Date(a.eta) - new Date(b.eta))
                    .slice(0, 3);

                if (filtered.length === 0) {
                    etaDisplay.innerHTML = '<span class="eta-placeholder">末班車已過 / 暫無服務</span>';
                    return;
                }

                const now = new Date();
                const html = filtered.map(item => {
                    const etaTime = new Date(item.eta);
                    const diffMins = Math.max(0, Math.round((etaTime - now) / 60000));
                    const timeText = diffMins === 0 ? '即將到達' : `${diffMins} 分鐘`;
                    const rmkText = item.rmk_tc ? item.rmk_tc : '';

                    return `
                        <div class="eta-badge">
                            <span>${timeText}</span>
                            ${rmkText ? `<span class="eta-rmk">${rmkText}</span>` : ''}
                        </div>
                    `;
                }).join('');

                etaDisplay.innerHTML = html;

            } catch (err) {
                console.error("抓取 ETA 失敗:", err);
                etaDisplay.innerHTML = '<span class="eta-placeholder">ETA 載入失敗</span>';
            }
        }
    </script>
</body>
</html>
